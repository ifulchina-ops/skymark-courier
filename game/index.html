<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Skymark Courier — a dawn canyon flight game</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        background: #10182e;
        height: 100%;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: system-ui, sans-serif;
      }
      #wrap {
        position: relative;
        line-height: 0;
      }
      canvas {
        display: block;
        width: 1280px;
        height: 720px;
        max-width: 100vw;
        max-height: 100vh;
        background: #16224e;
      }
      #status {
        position: absolute;
        left: -9999px;
        top: auto;
        width: 1px;
        height: 1px;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <div id="wrap">
      <canvas id="game" width="1280" height="720" aria-label="Skymark Courier flight game"></canvas>
      <p id="status" role="status" aria-live="polite"></p>
    </div>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
